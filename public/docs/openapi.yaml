  '/api/messages/{message}/approve':
    post:
      summary: 'Approve a draft'
      operationId: approveADraft
      description: "Approves the draft and gives it a send slot.\n\nReturns 403 unless an administrator has set\nOUTREACH_API_ALLOW_APPROVAL=true, whatever abilities the key carries.\nApproving is the point where a human normally reads the email before a\nreal person receives it, so a key cannot do it by default.\n\nA success with no send time is not an error: it means no mailbox was\nsendable at that moment, and the reconciler picks it up later."
      parameters: []
      responses: {}
      tags:
        - Messages
    parameters:
      -
        in: path
        name: message
        description: ''
        example: 1
        required: true
        schema:
          type: integer
