    post:
      summary: 'Push a contact'
      operationId: pushAContact
      description: "Upserts the contact and enrolls them in the automation matching each\ntag. A suppressed address is accepted and nothing is enrolled, so read\nGET /api/suppressions first if you need to know that happened."
      parameters: []
      responses: {}
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The contact's address."
                  example: jane.doe@acme.example
                name:
                  type: string
                  description: 'The full name. Send this or the two parts; whichever you send wins, and the rest is filled in.'
                  example: 'Jane Doe'
                  nullable: true
                first_name:
                  type: string
                  description: ''
                  example: Jane
                  nullable: true
                last_name:
                  type: string
                  description: ''
                  example: Doe
                  nullable: true
                company:
                  type: string
                  description: ''
                  example: 'Acme Ltd'
                  nullable: true
                website:
                  type: string
                  description: ''
                  example: 'https://acme.example'
                  nullable: true
                custom:
                  type: object
                  description: 'Anything else worth passing to the drafter.'
                  example:
                    industry: SaaS
                  properties: {}
                  nullable: true
                source:
                  type: string
                  description: 'Where the lead came from.'
                  example: tube-trend-tool
                  nullable: true
                tags:
                  type: array
                  description: 'One or more automation tags to enroll into.'
                  example:
                    - seo-backlinks
                  items:
                    type: string
              required:
                - email
                - tags
