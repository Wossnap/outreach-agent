openapi: 3.0.3
info:
  title: 'Outreach Agent API'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'https://outreach.seannocode.com'
tags:
  -
    name: Health
    description: "\nIs the API up."
  -
    name: Contacts
    description: "\nPeople we email, and everything that has passed between us and them."
  -
    name: Automations
    description: "\nA sequence of emails, identified by the tag that enrolls contacts into it."
  -
    name: Enrollments
    description: "\nA contact moving through an automation."
  -
    name: Messages
    description: "\nIndividual emails, from draft through to sent."
  -
    name: Replies
    description: "\nWhat came back: genuine replies, bounces, auto-responders and opt-outs."
  -
    name: Suppressions
    description: "\nThe do-not-email list. Read it before pushing contacts."
  -
    name: Mailboxes
    description: "\nThe Gmail accounts that send. Connected in the dashboard, managed here."
  -
    name: Stats
    description: "\nCounts across the system in one request."
  -
    name: Activity
    description: "\nThe system log: sends, failures, bounces, opt-outs and polling errors."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Create a key in the dashboard under <b>Settings &rarr; API keys</b>. It is shown once.\n\nEach key carries one or more abilities and an endpoint accepts only the ones it lists:\n\n<ul>\n<li><code>read</code> &mdash; every GET</li>\n<li><code>write</code> &mdash; push contacts, edit and reject drafts, manage automations and mailboxes</li>\n<li><code>approve</code> &mdash; approve a draft so it sends</li>\n</ul>\n\nGive a key only what it needs. A tool that just pushes leads needs <code>write</code>,\nnot <code>read</code>.\n\nWrong key gives 401; a valid key without the right ability gives 403, and the message\nsays which ability was missing."
security:
  -
    default: []
paths:
  /api/health:
    get:
      summary: 'Health check'
      operationId: healthCheck
      description: "Confirms the API is up. The only endpoint that needs no API key, so it\nis safe to poll from a monitor."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: ok
                  data:
                    time: '2026-09-01T09:00:00+00:00'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      time:
                        type: string
                        example: '2026-09-01T09:00:00+00:00'
      tags:
        - Health
      security: []
  /api/contacts:
    get:
      summary: 'List contacts'
      operationId: listContacts
      description: 'Newest first.'
      parameters:
        -
          in: query
          name: email
          description: 'Exact address. e.g. jane.doe@acme.example.'
          example: null
          required: false
          schema:
            type: string
            description: 'Exact address. e.g. jane.doe@acme.example.'
            example: null
        -
          in: query
          name: company
          description: 'Partial match on company. e.g. Acme.'
          example: null
          required: false
          schema:
            type: string
            description: 'Partial match on company. e.g. Acme.'
            example: null
        -
          in: query
          name: q
          description: 'Partial match on email, either name, or company. e.g. acme.'
          example: null
          required: false
          schema:
            type: string
            description: 'Partial match on email, either name, or company. e.g. acme.'
            example: null
        -
          in: query
          name: tag
          description: 'Only contacts enrolled in this automation. e.g. seo-backlinks.'
          example: null
          required: false
          schema:
            type: string
            description: 'Only contacts enrolled in this automation. e.g. seo-backlinks.'
            example: null
        -
          in: query
          name: status
          description: 'Only contacts with an enrollment in this state. e.g. active.'
          example: null
          required: false
          schema:
            type: string
            description: 'Only contacts with an enrollment in this state. e.g. active.'
            example: null
        -
          in: query
          name: suppressed
          description: 'true for opted-out contacts only, false to exclude them. e.g. true.'
          example: null
          required: false
          schema:
            type: boolean
            description: 'true for opted-out contacts only, false to exclude them. e.g. true.'
            example: null
        -
          in: query
          name: since
          description: 'ISO date. Only rows created on or after it. e.g. 2026-08-01.'
          example: null
          required: false
          schema:
            type: string
            description: 'ISO date. Only rows created on or after it. e.g. 2026-08-01.'
            example: null
        -
          in: query
          name: per_page
          description: 'Rows per page. Clamped to 200. e.g. 50.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Rows per page. Clamped to 200. e.g. 50.'
            example: null
        -
          in: query
          name: page
          description: 'Which page to return. e.g. 1.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Which page to return. e.g. 1.'
            example: null
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: ok
                  data:
                    -
                      id: 2
                      email: sam.patel@globex.example
                      name: 'Sam Patel'
                      first_name: Sam
                      last_name: Patel
                      company: Globex
                      website: 'https://globex.example'
                      source: tube-trend-tool
                      custom: []
                      created_at: '2026-09-02T09:52:27+00:00'
                      updated_at: '2026-09-02T09:52:27+00:00'
                    -
                      id: 1
                      email: jane.doe@acme.example
                      name: 'Jane Doe'
                      first_name: Jane
                      last_name: Doe
                      company: 'Acme Ltd'
                      website: 'https://acme.example'
                      source: tube-trend-tool
                      custom:
                        industry: SaaS
                        employees: 40
                      created_at: '2026-09-02T09:52:27+00:00'
                      updated_at: '2026-09-02T09:52:27+00:00'
                  meta:
                    page: 1
                    per_page: 50
                    total: 2
                    last_page: 1
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ok
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        email: sam.patel@globex.example
                        name: 'Sam Patel'
                        first_name: Sam
                        last_name: Patel
                        company: Globex
                        website: 'https://globex.example'
                        source: tube-trend-tool
                        custom: []
                        created_at: '2026-09-02T09:52:27+00:00'
                        updated_at: '2026-09-02T09:52:27+00:00'
                      -
                        id: 1
