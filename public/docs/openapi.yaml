openapi: 3.0.3
info:
  title: 'Outreach Agent API'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Health
    description: "\nIs the API up."
  -
    name: Contacts
    description: "\nPeople we email, and everything that has passed between us and them."
  -
    name: Automations
    description: "\nA sequence of emails, identified by the tag that enrolls contacts into it."
  -
    name: Enrollments
    description: "\nA contact moving through an automation."
  -
    name: Messages
    description: "\nIndividual emails, from draft through to sent."
  -
    name: Replies
    description: "\nWhat came back: genuine replies, bounces, auto-responders and opt-outs."
  -
    name: Suppressions
    description: "\nThe do-not-email list. Read it before pushing contacts."
  -
    name: Mailboxes
    description: "\nThe Gmail accounts that send. Connected in the dashboard, managed here."
  -
    name: Stats
    description: "\nCounts across the system in one request."
  -
    name: Activity
    description: "\nThe system log: sends, failures, bounces, opt-outs and polling errors."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Create a key in the dashboard under <b>Settings &rarr; API keys</b>. It is shown once.\n\nEach key carries one or more abilities and an endpoint accepts only the ones it lists:\n\n<ul>\n<li><code>read</code> &mdash; every GET</li>\n<li><code>write</code> &mdash; push contacts, edit and reject drafts, manage automations and mailboxes</li>\n<li><code>approve</code> &mdash; approve a draft so it sends</li>\n</ul>\n\nGive a key only what it needs. A tool that just pushes leads needs <code>write</code>,\nnot <code>read</code>.\n\nWrong key gives 401; a valid key without the right ability gives 403, and the message\nsays which ability was missing."
security:
  -
    default: []
paths:
  /api/health:
    get:
      summary: 'Health check'
      operationId: healthCheck
      description: "Confirms the API is up. The only endpoint that needs no API key, so it\nis safe to poll from a monitor."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: ok
                  data:
                    time: '2026-09-01T09:00:00+00:00'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      time:
                        type: string
                        example: '2026-09-01T09:00:00+00:00'
      tags:
        - Health
      security: []
  /api/contacts:
    get:
      summary: 'List contacts'
      operationId: listContacts
      description: 'Newest first.'
      parameters:
        -
          in: query
          name: email
          description: 'Exact address. e.g. jane.doe@acme.example.'
          example: null
          required: false
          schema:
            type: string
            description: 'Exact address. e.g. jane.doe@acme.example.'
            example: null
        -
          in: query
          name: company
          description: 'Partial match on company. e.g. Acme.'
          example: null
          required: false
          schema:
            type: string
            description: 'Partial match on company. e.g. Acme.'
            example: null
        -
          in: query
          name: q
          description: 'Partial match on email, either name, or company. e.g. acme.'
          example: null
          required: false
          schema:
            type: string
            description: 'Partial match on email, either name, or company. e.g. acme.'
            example: null
        -
          in: query
          name: tag
          description: 'Only contacts enrolled in this automation. e.g. seo-backlinks.'
          example: null
          required: false
          schema:
            type: string
            description: 'Only contacts enrolled in this automation. e.g. seo-backlinks.'
            example: null
        -
          in: query
          name: status
          description: 'Only contacts with an enrollment in this state. `waiting_email` means enrolled with no confirmed address yet. e.g. active.'
          example: null
          required: false
          schema:
            type: string
            description: 'Only contacts with an enrollment in this state. `waiting_email` means enrolled with no confirmed address yet. e.g. active.'
            example: null
        -
          in: query
          name: email_status
          description: 'How far the waterfall has got: pending, finding, verifying, valid, risky, invalid, not_found. Only `valid` is sendable on its own. e.g. valid.'
          example: null
          required: false
          schema:
            type: string
            description: 'How far the waterfall has got: pending, finding, verifying, valid, risky, invalid, not_found. Only `valid` is sendable on its own. e.g. valid.'
            example: null
        -
          in: query
          name: suppressed
          description: 'true for opted-out contacts only, false to exclude them. e.g. true.'
          example: null
          required: false
          schema:
            type: boolean
            description: 'true for opted-out contacts only, false to exclude them. e.g. true.'
            example: null
        -
          in: query
          name: since
          description: 'ISO date. Only rows created on or after it. e.g. 2026-08-01.'
          example: null
          required: false
          schema:
            type: string
            description: 'ISO date. Only rows created on or after it. e.g. 2026-08-01.'
            example: null
        -
          in: query
          name: per_page
          description: 'Rows per page. Clamped to 200. e.g. 50.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Rows per page. Clamped to 200. e.g. 50.'
            example: null
        -
          in: query
          name: page
          description: 'Which page to return. e.g. 1.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Which page to return. e.g. 1.'
            example: null
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid API key.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid API key.'
      tags:
        - Contacts
    post:
      summary: 'Push a contact'
      operationId: pushAContact
      description: "Upserts the contact and enrolls them in the automation matching each tag.\n\nA contact does not have to arrive with an email address. Send whichever\nyou have: an email, a LinkedIn profile_url, or a name together with a\ndomain, and the address is found and checked for you. Until something has\nconfirmed an address, enrollments are created but held at\n`waiting_email`, and they start on their own the moment it is confirmed.\n\nSubmitting the same person again updates them rather than creating a\nsecond record, so a caller that has lost track of what it already sent\ncan safely send it again. A suppressed address is stored and nothing is\nenrolled."
      parameters: []
      responses: {}
      tags:
        - Contacts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contacts:
                  type: array
                  description: 'Send this INSTEAD of every field above to push up to 500 people at once. Each entry takes exactly the same fields as a single push. A batch is all or nothing, so a caller never has to work out which half of it landed. Left out of the example below so the request is sendable as it stands.'
                  example: null
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        description: 'Must be a valid email address. Must not be greater than 255 characters.'
                        example: bauch.marcelo@example.com
                        nullable: true
                      profile_url:
                        type: string
                        description: 'Must be a valid URL. Must not be greater than 255 characters.'
                        example: 'http://mclaughlin.info/dolores-enim-non-facere-tempora'
                        nullable: true
                      name:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: t
                        nullable: true
                      first_name:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: u
                        nullable: true
                      last_name:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: j
                        nullable: true
                      company:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: w
                        nullable: true
                      domain:
                        type: string
                        description: 'Must not be greater than 2048 characters.'
                        example: v
                        nullable: true
                      job_title:
                        type: string
                        description: 'Must not be greater than 1000 characters.'
                        example: l
                        nullable: true
                      category:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: x
                        nullable: true
                      niche:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: j
                        nullable: true
                      company_url:
                        type: string
                        description: 'Must be a valid URL. Must not be greater than 255 characters.'
                        example: 'http://www.kshlerin.com/'
                        nullable: true
                      source:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: p
                        nullable: true
                      extra:
                        type: object
                        description: ''
                        example: null
                        properties: {}
                        nullable: true
                      tags:
                        type: array
                        description: 'Must not be greater than 255 characters.'
                        example:
                          - p
                        items:
                          type: string
                email:
                  type: string
                  description: "The contact's address."
                  example: jane.doe@acme.example
                  nullable: true
                profile_url:
                  type: string
                  description: 'A LinkedIn profile.'
                  example: 'https://linkedin.com/in/jane-doe'
                  nullable: true
                name:
                  type: string
                  description: 'The full name. Send this or the two parts; whichever you send wins, and the rest is filled in.'
                  example: 'Jane Doe'
                  nullable: true
                first_name:
                  type: string
                  description: ''
                  example: Jane
                  nullable: true
                last_name:
                  type: string
                  description: ''
                  example: Doe
                  nullable: true
                company:
                  type: string
                  description: ''
                  example: 'Acme Ltd'
                  nullable: true
                domain:
                  type: string
                  description: "The company's domain, which is what an address is searched by. A full URL is fine; it is reduced to the host."
                  example: acme.example
                  nullable: true
                job_title:
                  type: string
                  description: ''
                  example: 'Head of Operations'
                  nullable: true
                category:
                  type: string
                  description: "The lead's market category."
                  example: 'Home services'
                  nullable: true
                niche:
                  type: string
                  description: 'The niche within that category.'
                  example: Landscaping
                  nullable: true
                company_url:
                  type: string
                  description: "The company's LinkedIn page."
                  example: 'https://linkedin.com/company/acme'
                  nullable: true
                source:
                  type: string
                  description: 'Where the lead came from.'
                  example: tube-trend-tool
                  nullable: true
                extra:
                  type: object
                  description: 'Anything else worth passing to the drafter. Filed under your source, so two callers can both send a "score" and mean different things.'
                  example:
                    industry: SaaS
                  properties: {}
                  nullable: true
                tags:
                  type: array
                  description: 'Automation tags to enroll into.'
                  example:
                    - seo-backlinks
                  items:
                    type: string
  '/api/contacts/{contact}':
    get:
      summary: 'Get one contact'
      operationId: getOneContact
      description: "The contact with its enrollments, every email sent to them and every\nreply received, in one request."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid API key.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid API key.'
      tags:
        - Contacts
    parameters:
      -
        in: path
        name: contact
        description: 'An id or an email address.'
        example: jane.doe@acme.example
        required: true
        schema:
          type: string
  /api/automations:
    get:
      summary: 'List automations'
      operationId: listAutomations
      description: 'Each with its steps.'
      parameters:
        -
          in: query
          name: active
          description: 'Only switched-on or switched-off automations. e.g. true.'
          example: null
          required: false
          schema:
            type: boolean
            description: 'Only switched-on or switched-off automations. e.g. true.'
            example: null
        -
          in: query
          name: tag
          description: 'Exact tag. e.g. seo-backlinks.'
          example: null
          required: false
          schema:
            type: string
            description: 'Exact tag. e.g. seo-backlinks.'
            example: null
        -
          in: query
          name: per_page
          description: 'Rows per page. Clamped to 200. e.g. 50.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Rows per page. Clamped to 200. e.g. 50.'
            example: null
        -
          in: query
          name: page
          description: 'Which page to return. e.g. 1.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Which page to return. e.g. 1.'
            example: null
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid API key.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid API key.'
      tags:
        - Automations
    post:
      summary: 'Create an automation'
      operationId: createAnAutomation
      description: "Optionally with its steps in the same call.\n\nThe tag is how contacts get enrolled: pushing a contact with that tag to\nPOST /api/contacts starts them on this sequence."
      parameters: []
      responses: {}
      tags:
        - Automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
                  description: ''
                  example: seo-backlinks
                name:
                  type: string
                  description: ''
                  example: 'SEO backlinks outreach'
                description:
                  type: string
                  description: ''
                  example: 'Two touches for sites that could carry a link back to us.'
                  nullable: true
                active:
                  type: boolean
                  description: 'Defaults to true.'
                  example: true
                  nullable: true
                steps:
                  type: array
                  description: 'The sequence, optional here and addable later.'
                  example:
                    - []
                  items:
                    type: object
                    nullable: true
                    properties:
                      position:
                        type: integer
                        description: '1 is the first email.'
                        example: 1
                      delay_days:
                        type: integer
                        description: 'Days after the previous step.'
                        example: 0
                        nullable: true
                      delay_hours:
                        type: integer
                        description: 'Hours after the previous step.'
                        example: 0
                        nullable: true
                      drafting_instructions:
                        type: string
                        description: 'What Claude should write.'
                        example: 'Short, friendly cold email asking if they would consider a guest post. Two sentences, no pitch.'
                      active:
                        type: boolean
                        description: ''
                        example: true
                        nullable: true
                    required:
                      - position
                      - drafting_instructions
              required:
                - tag
                - name
  '/api/automations/{automation}':
    get:
      summary: 'Get one automation'
      operationId: getOneAutomation
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid API key.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid API key.'
      tags:
        - Automations
    patch:
      summary: 'Update an automation'
      operationId: updateAnAutomation
      description: ''
      parameters: []
      responses: {}
      tags:
        - Automations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: string
                  description: ''
                  example: seo-backlinks
                name:
                  type: string
                  description: ''
                  example: 'SEO backlinks outreach'
                description:
                  type: string
                  description: ''
                  example: 'Two touches for sites that could carry a link back to us.'
                  nullable: true
                active:
                  type: boolean
                  description: 'Switch the whole sequence off without deleting it.'
                  example: false
    parameters:
      -
        in: path
        name: automation
        description: 'An id or a tag.'
        example: seo-backlinks
        required: true
        schema:
          type: string
  '/api/automations/{automation}/steps':
    get:
      summary: 'List steps'
      operationId: listSteps
      description: 'Every step of one automation, with the files attached to each.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid API key.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid API key.'
      tags:
        - Automations
    post:
      summary: 'Add a step'
      operationId: addAStep
      description: "Position 1 is the first email; later positions are the follow-ups, sent\ndelay_days and delay_hours after the previous one."
      parameters: []
      responses: {}
      tags:
        - Automations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: integer
                  description: '1 is the first email.'
                  example: 2
                delay_days:
                  type: integer
                  description: 'Days after the previous step.'
                  example: 3
                  nullable: true
                delay_hours:
                  type: integer
                  description: 'Hours after the previous step.'
                  example: 0
                  nullable: true
                drafting_instructions:
                  type: string
                  description: ''
                  example: 'Brief follow-up. Reference the first email, ask if they saw it.'
                active:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
              required:
                - position
                - drafting_instructions
    parameters:
      -
        in: path
        name: automation
        description: 'An id or a tag.'
        example: seo-backlinks
        required: true
        schema:
          type: string
  '/api/automations/{automation}/steps/{step}':
    patch:
      summary: 'Update a step'
      operationId: updateAStep
      description: ''
      parameters: []
      responses: {}
      tags:
        - Automations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: integer
                  description: ''
                  example: 2
                delay_days:
                  type: integer
                  description: ''
                  example: 3
                delay_hours:
                  type: integer
                  description: ''
                  example: 0
                drafting_instructions:
                  type: string
                  description: ''
                  example: 'Brief follow-up. Reference the first email, ask if they saw it.'
                active:
                  type: boolean
                  description: 'Switch one step off without deleting it.'
                  example: false
    delete:
      summary: 'Delete a step'
      operationId: deleteAStep
      description: ''
      parameters: []
      responses: {}
      tags:
        - Automations
    parameters:
      -
        in: path
        name: automation
        description: 'An id or a tag.'
        example: seo-backlinks
        required: true
        schema:
          type: string
      -
        in: path
        name: step
        description: ''
        example: 1
        required: true
        schema:
          type: integer
  '/api/automations/{automation}/steps/{step}/attachments':
    post:
      summary: 'Attach a file to a step'
      operationId: attachAFileToAStep
      description: "Send it as multipart/form-data under `file`.\n\nThe file goes out with this step's email only. To attach the same file\nto every email in the sequence, upload it to each step.\n\nExecutables and archives are refused: recipients' gateways strip or\nquarantine them, and that cost lands on the whole sending domain."
      parameters: []
      responses: {}
      tags:
        - Automations
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "The file to attach. Choose it in Postman's Body tab."
              required:
                - file
    parameters:
      -
        in: path
        name: automation
        description: 'An id or a tag.'
        example: seo-backlinks
        required: true
        schema:
          type: string
      -
        in: path
        name: step
        description: ''
        example: 1
        required: true
        schema:
          type: integer
  '/api/automations/{automation}/steps/{step}/attachments/{attachment}':
    delete:
      summary: 'Remove an attachment'
      operationId: removeAnAttachment
      description: 'Deletes the file as well as the reference to it.'
      parameters: []
      responses: {}
      tags:
        - Automations
    parameters:
      -
        in: path
        name: automation
        description: 'An id or a tag.'
        example: seo-backlinks
        required: true
        schema:
          type: string
      -
        in: path
        name: step
        description: ''
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: attachment
        description: "The attachment id from the step's attachments array."
        example: 9b1c7e2a4f6d4c8e9a0b1c2d3e4f5a6b
        required: true
        schema:
          type: string
  /api/enrollments:
    get:
      summary: 'List enrollments'
      operationId: listEnrollments
      description: 'Newest first.'
      parameters:
        -
          in: query
          name: status
          description: 'One of active, waiting_email, completed, stopped_reply, stopped_unsubscribe, stopped_bounce, stopped_suppressed, stopped_rejected, cancelled, failed. `waiting_email` means enrolled, with no confirmed address to send to yet. e.g. active.'
          example: null
          required: false
          schema:
            type: string
            description: 'One of active, waiting_email, completed, stopped_reply, stopped_unsubscribe, stopped_bounce, stopped_suppressed, stopped_rejected, cancelled, failed. `waiting_email` means enrolled, with no confirmed address to send to yet. e.g. active.'
            example: null
        -
          in: query
          name: contact_id
          description: 'e.g. 1.'
          example: null
          required: false
          schema:
            type: integer
            description: 'e.g. 1.'
            example: null
        -
          in: query
          name: automation_id
          description: 'e.g. 1.'
          example: null
          required: false
          schema:
            type: integer
            description: 'e.g. 1.'
            example: null
        -
          in: query
          name: tag
          description: 'Automation tag. e.g. seo-backlinks.'
          example: null
          required: false
          schema:
            type: string
            description: 'Automation tag. e.g. seo-backlinks.'
            example: null
        -
          in: query
          name: mailbox_id
          description: 'e.g. 1.'
          example: null
          required: false
          schema:
            type: integer
            description: 'e.g. 1.'
            example: null
        -
          in: query
          name: per_page
          description: 'Rows per page. Clamped to 200. e.g. 50.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Rows per page. Clamped to 200. e.g. 50.'
            example: null
        -
          in: query
          name: page
          description: 'Which page to return. e.g. 1.'
          example: null
          required: false
          schema:
            type: integer
            description: 'Which page to return. e.g. 1.'
            example: null
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid API key.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid API key.'
      tags:
        - Enrollments
    post:
      summary: 'Enroll a contact'
      operationId: enrollAContact
      description: "Puts a contact already on file into an automation and starts drafting\nstep 1. POST /api/contacts is the route for new leads; this one is for\nsomeone who should also go through another sequence.\n\nIdentify the contact by contact_id or email, and the automation by\nautomation_id or tag."
      parameters: []
      responses: {}
      tags:
        - Enrollments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contact_id:
                  type: integer
                  description: 'Alternative to email. Left out of the example below so the request is sendable as it stands.'
                  example: null
                email:
                  type: string
                  description: "The contact's address. Send this or contact_id."
                  example: jane.doe@acme.example
                tag:
                  type: string
                  description: "The automation's tag. Send this or automation_id."
                  example: seo-backlinks
                automation_id:
                  type: integer
                  description: 'Alternative to tag. Left out of the example below so the request is sendable as it stands.'
                  example: null
  '/api/enrollments/{enrollment}':
