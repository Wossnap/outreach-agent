  '/api/mailboxes/{mailbox}/disconnect':
    post:
      summary: 'Disconnect a mailbox'
      operationId: disconnectAMailbox
      description: "Tells Google to forget this application, discards the stored\ncredentials, and stops the mailbox sending. Stronger than pausing: a\npaused mailbox keeps its connection and resumes with one call, whereas a\ndisconnected one needs a person to sign in at Google again.\n\nAnything queued to send through it is released and picked up by another\nmailbox. Emails already handed to Gmail still go out.\n\nThe history is kept, so reconnecting the same address reuses this\nmailbox rather than creating a second one."
      parameters: []
      responses: {}
      tags:
        - Mailboxes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'Recorded against the mailbox and in the activity log.'
                  example: 'Reason for disconnecting'
                  nullable: true
